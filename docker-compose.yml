services:
  whisper-intel-gpu:
    build: .
    image: intel-gpu-python312-openvino:latest
    container_name: whisper-intel
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./output:/app/output
    # devices:
    #   - /dev/dri:/dev/dri  # Intel GPU 直通 (僅 Linux/WSL2，Windows 請註解)
    environment:
      - OV_DEVICE=GPU.0
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
    # Docker 內無桌面/麥克風，改跑檔案轉寫；即時版 realtime_to_nr1.py 請在 Windows 原生跑
    command: python src/transcribe.py

  # 純 CPU 備用 (不需要 GPU 直通)
  whisper-cpu:
    build: .
    image: intel-gpu-python312-openvino:latest
    container_name: whisper-cpu
    profiles: ["cpu"]
    volumes:
      - ./src:/app/src
      - ./models:/app/models
      - ./output:/app/output
    environment:
      - OV_DEVICE=CPU
    command: python src/transcribe.py
